[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-learning"
version = "0.1.0"
description = "A practical Chinese-first learning path from model APIs to RAG, agents and MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "DawnVerge"}]
dependencies = [
  "openai>=1.109.1,<4",
  "langchain>=1.4.3,<2",
  "langchain-core>=1.6.3,<2",
  "langchain-community>=0.4.2,<0.5",
  "dashscope>=1.27.7,<2",
  "pydantic>=2.7.4,<3",
  "numpy>=1.26.2,<3",
]

[project.optional-dependencies]
rag = ["langchain-text-splitters>=1.1.3,<2", "langchain-chroma>=1.1.0,<2", "PyMuPDF>=1.24,<2", "beautifulsoup4>=4.12,<5", "requests>=2.32.5,<3", "rank-bm25>=0.2.2,<0.3", "jieba>=0.42.1,<0.43"]
mcp = ["mcp>=1.28,<2", "langchain-mcp-adapters>=0.3.2,<0.4"]
sql = ["SQLAlchemy>=2.0,<3", "PyMySQL>=1.1,<2"]
all = ["ai-agent-learning[rag,mcp,sql]"]
dev = ["ruff>=0.9,<1", "reportlab>=4,<5"]

[project.scripts]
ai-learn = "ai_learning.cli:main"

[project.urls]
Homepage = "https://github.com/DawnVerge/ai-agent-learning"
Issues = "https://github.com/DawnVerge/ai-agent-learning/issues"

[tool.setuptools.packages.find]
include = ["ai_learning*"]

[tool.setuptools.package-data]
ai_learning = ["catalog.json"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
